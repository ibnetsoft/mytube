<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>돌아오는 검 · 장면 연출</title>
<style>
@font-face{font-family:NotoSansKR;src:url('../fonts/NotoSansKR-Bold.ttf')}@font-face{font-family:DoHyeon;src:url('../fonts/DoHyeon-Regular.ttf')}@font-face{font-family:BlackHanSans;src:url('../fonts/BlackHanSans-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:#0c1219;color:#e8eef4;font:15px/1.7 NotoSansKR,system-ui,sans-serif}main{max-width:1440px;padding:28px;margin:auto}header{display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font-size:28px;margin:0}header p{color:#9aabbc;font-size:12px;margin:4px 0 18px}a{color:#7be5db}#stage{display:block;width:100%;aspect-ratio:16/9;background:#000;border:1px solid #293647;border-radius:8px;overflow:hidden}nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 0}button,select{font:inherit;background:#1d2938;border:1px solid #40516a;color:#ecf4fc;padding:8px 12px;border-radius:5px;cursor:pointer}button:hover{background:#2b4151}input[type=range]{flex:1;min-width:150px;accent-color:#75decc}label{font-size:12px;color:#9aaebd}#counter{font-variant-numeric:tabular-nums;color:#95c9d5}article{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{padding:18px;background:#131e2a;border:1px solid #263747;border-radius:6px}h2{font-size:16px;margin:0 0 10px}#script p{color:#aebfcf;font-size:13px;margin:7px 0}#script b{color:#70d6c5}#cuts{display:flex;gap:8px;flex-wrap:wrap}#cuts button{font-size:12px}#intent{font-size:13px;color:#afc4d3}footer{color:#8d9dac;font:12px/1.8 system-ui,sans-serif;margin:20px 0}body.full main{max-width:none}@media(max-width:800px){main{padding:12px}article{grid-template-columns:1fr}header{display:block}h1{font-size:22px}nav{gap:6px}button,select{padding:7px}header p{margin-bottom:10px}}
</style><main><header><div><h1>돌아오는 검 <span style="color:#5cc8bd;font-size:15px">EP.02</span></h1><p>정지 원화 + 별도 텍스트·효과 레이어 · 24장면 / 48컷</p></div><a href="storyboard.html">전체 원화 보기 ↗</a></header>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="1화 장면 연출 미리보기"><defs><radialGradient id="flash"><stop stop-color="#fff6de" stop-opacity=".95"/><stop offset="1" stop-color="#fff6de" stop-opacity="0"/></radialGradient><radialGradient id="focus"><stop stop-color="#72e4ff" stop-opacity=".65"/><stop offset="1" stop-color="#72e4ff" stop-opacity="0"/></radialGradient></defs><g id="picture"><image id="art" href="" x="-34" y="-19" width="1988" height="1118"/></g><g id="fx"></g><g id="graphics"></g></svg>
<nav><button id="play">▶ 재생</button><button id="prev" aria-label="이전 장면">←</button><select id="scene" aria-label="장면 선택"></select><button id="next" aria-label="다음 장면">→</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="장면 진행"><span id="counter"></span><select id="speed" aria-label="재생 속도"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><label><input id="textToggle" type="checkbox" checked> 글자</label><label><input id="fxToggle" type="checkbox" checked> 효과</label></nav>
<article><section><h2 id="sceneTitle"></h2><div id="cuts"></div><p id="intent"></p></section><section><h2>음성 대본 · 화면 밖 검토용</h2><div id="script"></div></section></article>
<footer>연출 검토용 무음 프리뷰입니다. 재생 시간은 컷 검토를 위한 임시 배분이며 실제 녹음 싱크가 아닙니다. AE 원본용 <a href="ae-scene-package.json">연출 데이터</a> · <a href="build_ae_preview.jsx">컴포지션 생성 스크립트</a><br>내레이션 원문은 영상 위에 표시하지 않습니다. 인물 움직임은 상태 컷으로 바꾸고, 효과와 글자만 별도 레이어로 재생합니다.</footer></main>
<script>
const DATA=/*__MANIFEST__*/;
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
let sceneIndex=0,t=0,playing=false,last=0,asset='';
function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function color(v){return 'rgb('+v.map(x=>Math.round(x*255)).join(',')+')'}
function family(name){return name.startsWith('Noto')?'NotoSansKR':name.startsWith('Black')?'BlackHanSans':'DoHyeon'}
function lines(text,max){const result=[];for(const para of text.split('\n')){let row='';for(let word of para.split(' ')){if(row&&row.length+1+word.length>max){result.push(row);row=''}while(word.length>max){if(row){result.push(row);row=''}result.push(word.slice(0,max));word=word.slice(max)}row+=(row?' ':'')+word}if(row)result.push(row)}return result}
function text(g,opacity){const L=g.layout,S=g.style,c=[L.center[0]*1920,L.center[1]*1080],width=L.size[0]*1920*(g.kind==='speech_bubble'?.78:.94),height=L.size[1]*1080*.80;
 let size=S.size,rows=lines(g.text,Math.max(7,Math.floor(width/size)));while((rows.length*size*1.16>height||Math.max(...rows.map(x=>x.length))*size>width)&&size>26){size-=1;rows=lines(g.text,Math.max(7,Math.floor(width/size)))}
 const group=el('g',{opacity});
 if(g.kind==='speech_bubble'){const rx=L.size[0]*960,ry=L.size[1]*540,tail=[L.tail[0]*1920,L.tail[1]*1080],bx=c[0]+(tail[0]<c[0]?-1:1)*rx*.36,by=c[1]+ry*.58;group.append(el('path',{d:`M${bx-18},${by} L${tail[0]},${tail[1]} L${bx+18},${by} Z`,fill:'#fffef7',stroke:'#151b22','stroke-width':3}));group.append(el('ellipse',{cx:c[0],cy:c[1],rx,ry,fill:'#fffef7',stroke:'#151b22','stroke-width':3}));}
 const txt=el('text',{x:c[0],y:c[1]-(rows.length-1)*size*.58+size*.35,'text-anchor':'middle','font-family':family(S.font),'font-size':size,fill:color(S.fill),'paint-order':'stroke fill',stroke:S.stroke?color(S.stroke):'none','stroke-width':S.stroke_width||0,'stroke-linejoin':'round',transform:`rotate(${S.rotation||0} ${c[0]} ${c[1]})`});
 for(let i=0;i<rows.length;i++)txt.append(el('tspan',{x:c[0],dy:i?size*1.16:0},rows[i]));group.append(txt);$('graphics').append(group);
}
function choose(i){sceneIndex=(i+DATA.scenes.length)%DATA.scenes.length;t=0;asset='';$('scene').value=sceneIndex;const s=DATA.scenes[sceneIndex];$('sceneTitle').textContent=s.scene_id+' · '+s.states.length+'컷';$('intent').textContent=s.intent;$('cuts').replaceChildren();for(const state of s.states){const b=document.createElement('button');b.textContent=state.asset_id.split('_STATE_')[1]+'컷';b.onclick=()=>{t=state.start*s.preview_duration_seconds;draw()};$('cuts').append(b)}$('script').replaceChildren();for(const b of s.blocks){const p=document.createElement('p'),who=document.createElement('b');who.textContent=(b.kind==='narration'?'나레이션':b.speaker||'속말')+' ';p.append(who,document.createTextNode(b.text));$('script').append(p)}draw()}
function draw(){const s=DATA.scenes[sceneIndex],fraction=Math.min(.999999,t/s.preview_duration_seconds),state=s.states.find(x=>x.start<=fraction&&fraction<x.end)||s.states.at(-1),image=$('art');
 if(asset!==state.asset_id){asset=state.asset_id;image.setAttribute('href','../'+state.file);let sc=Math.max(1920/state.width,1080/state.height)*1.035,cx=.5,cy=.5;if(state.static_crop){const C=state.static_crop;cx=(C[0]+C[2])/2;cy=(C[1]+C[3])/2;sc=Math.max(1920/((C[2]-C[0])*state.width),1080/((C[3]-C[1])*state.height),1920/(2*Math.min(cx,1-cx)*state.width),1080/(2*Math.min(cy,1-cy)*state.height))}image.setAttribute('x',960-cx*state.width*sc);image.setAttribute('y',540-cy*state.height*sc);image.setAttribute('width',state.width*sc);image.setAttribute('height',state.height*sc)}
 $('fx').replaceChildren();$('graphics').replaceChildren();$('picture').removeAttribute('transform');
 if($('fxToggle').checked)for(const e of s.effects){const elapsed=(fraction-e.preview_at)*s.preview_duration_seconds;if(elapsed<0||elapsed>e.duration_seconds)continue;const p=elapsed/e.duration_seconds,opacity=Math.sin(p*Math.PI),x=e.center[0]*1920,y=e.center[1]*1080,r=e.radius*1920;
 if(e.type==='impact_shake'){$('picture').setAttribute('transform',`translate(${Math.sin(p*26)*7*(1-p)} ${Math.cos(p*24)*5*(1-p)})`);continue}
 if(e.type==='debris_burst'){for(let j=0;j<9;j++){const a=j*2.399963,X=x+Math.cos(a)*r*p,Y=y+Math.sin(a)*r*.6*p+24*p;$('fx').append(el('path',{d:`M${X-6},${Y-5}l12,2l-3,10l-11,-2Z`,fill:'#887b64',opacity:opacity*.55}))}continue}
 if(e.type==='speedline_burst'){for(let j=0;j<10;j++){const a=j*Math.PI/5,dx=Math.cos(a),dy=Math.sin(a);$('fx').append(el('path',{d:`M${x+dx*r*.6},${y+dy*r*.6}L${x+dx*r*1.8-dy*2},${y+dy*r*1.8+dx*2}L${x+dx*r*1.8+dy*2},${y+dy*r*1.8-dx*2}Z`,fill:'#cceff5',opacity:opacity*.4}))}continue}
 $('fx').append(el('ellipse',{cx:x,cy:y,rx:r,ry:r*.7,fill:`url(#${e.type==='impact_flash'?'flash':'focus'})`,opacity:opacity*e.intensity}));}
 if($('textToggle').checked)for(const g of s.graphics){if(g.state_asset_id!==asset||fraction<g.preview_start||fraction>=g.preview_end)continue;const p=(fraction-g.preview_start)/(g.preview_end-g.preview_start);text(g,Math.min(1,p*15,(1-p)*15))}
 $('scrub').value=Math.round(fraction*1000);$('counter').textContent=asset.split('_STATE_')[1]+'컷 · '+t.toFixed(1)+' / '+s.preview_duration_seconds.toFixed(1)+'초';
 // Fade to black before an unshown result: no victory or contact added.
 if(sceneIndex===DATA.scenes.length-1&&fraction>.975)$('graphics').append(el('rect',{x:0,y:0,width:1920,height:1080,fill:'#000',opacity:Math.min(1,(fraction-.975)/.015)}));
}
for(let i=0;i<DATA.scenes.length;i++){const o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' 장면';$('scene').append(o)}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ 일시정지':'▶ 재생'};$('prev').onclick=()=>choose(sceneIndex-1);$('next').onclick=()=>choose(sceneIndex+1);$('scene').onchange=e=>choose(+e.target.value);$('scrub').oninput=e=>{t=(+e.target.value)/1000*DATA.scenes[sceneIndex].preview_duration_seconds;draw()};$('textToggle').onchange=$('fxToggle').onchange=draw;
window.preview={choose,draw,setTime(seconds){t=seconds;draw()},get data(){return DATA}};
function tick(now){if(last&&playing){t+=(now-last)/1000*Number($('speed').value);if(t>DATA.scenes[sceneIndex].preview_duration_seconds){if(sceneIndex===DATA.scenes.length-1){playing=false;$('play').textContent='▶ 재생';t=DATA.scenes.at(-1).preview_duration_seconds}else choose(sceneIndex+1)}draw()}last=now;requestAnimationFrame(tick)}choose(0);requestAnimationFrame(tick);
</script></html>
