<!doctype html><html lang="ko"><meta charset="utf-8"><title>AIR 로컬 미디어 워커</title><style>body{background:#121820;color:#ddd;font:16px sans-serif;max-width:900px;margin:40px auto}pre{white-space:pre-wrap;background:#1c2632;padding:20px;border-radius:12px}</style><h1>AE · 렌더 통합 워커</h1><p>AE와 렌더는 순서대로 실행됩니다. 대본 워커는 독립적으로 실행됩니다.</p><pre id="status">확인 중…</pre><p>로그: 작업 상태의 log 경로 또는 AIRWorker/logs/local-media</p><script>async function refresh(){try{const response=await fetch('/status');if(!response.ok)throw Error('조회 실패');const state=await response.json();document.querySelector('#status').textContent=JSON.stringify(state,null,2)}catch(error){document.querySelector('#status').textContent='워커 연결이 끊겼습니다.'}}refresh();setInterval(refresh,3000)</script></html>
