<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="local-token" content="__LOCAL_TOKEN__"><link rel="stylesheet" href="/production-settings.css"><script src="/production-settings.js" defer></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIR · 미디어 워커</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Malgun Gothic,sans-serif;background:#0b101b;color:#e6edf9}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:42px 32px}header,.row,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{color:#65decf;letter-spacing:3px;font-size:12px;font-weight:700}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}p{color:#8e9bb2;font-size:13px;line-height:1.7}.pill{border:1px solid #2b384c;border-radius:30px;padding:8px 13px;font-size:12px;color:#70e2c5}button,input{font:inherit;border:1px solid #2b384c;background:#151e2e;color:#e6edf9;border-radius:9px;padding:10px 14px}button{cursor:pointer}button:hover{border-color:#65decf}button.selected{background:#243f48;color:#85eedb;border-color:#45998e}.banner{background:linear-gradient(110deg,#172b36,#151e30);border:1px solid #28434c;border-radius:16px;padding:24px;margin:26px 0}.banner h2{margin:0 0 9px;font-size:19px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.stat{border:1px solid #263148;border-radius:13px;padding:18px;background:#111a29}.stat span{font-size:12px;color:#94a4bc}.stat strong{display:block;font-size:29px;margin-top:10px}.toolbar{margin:30px 0 18px;flex-wrap:wrap}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{font-size:12px;padding:8px 12px}input{width:230px}article{border:1px solid #27344a;background:#121c2c;border-radius:13px;padding:20px;margin-bottom:12px}.title{font-size:15px;font-weight:600;margin:7px 0 14px;overflow-wrap:anywhere}.tag{font-size:11px;letter-spacing:.5px;color:#87a1c4}.badge{font-size:12px;padding:6px 10px;border-radius:7px;background:#243249;color:#b7c7de}.working{background:#123b46;color:#72e3ee}.completed{background:#163a30;color:#73dcb1}.failed{background:#432733;color:#ff9ba9}.review{background:#403522;color:#f2cf85}.bar{height:6px;border-radius:5px;background:#27354b;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#66dcca;border-radius:5px}.meta{font-size:12px;color:#92a3ba;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.empty{text-align:center;padding:60px 20px;border:1px dashed #2b394d;border-radius:15px;color:#96a7bf}.error{color:#ffb4a3;background:#30252b;padding:13px;border-radius:9px;margin:15px 0}footer{font-size:11px;color:#7889a4;margin-top:28px}.subtle{font-size:12px;color:#91a4bd}details{margin-top:15px;font-size:12px;color:#9eafc6}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible,input:focus-visible{outline:2px solid #74edda;outline-offset:3px}@media(max-width:680px){main{padding:25px 16px}.cards{grid-template-columns:repeat(3,1fr)}header{align-items:flex-start}h1{font-size:24px}.toolbar input{width:100%}.row{align-items:flex-start}}
main{padding:16px 24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar nav,.top-actions{display:flex;align-items:center;gap:8px}.topbar nav button{font-weight:600}.topbar .pill{padding:6px 10px}.topbar #refresh{width:34px;height:34px;padding:7px;display:inline-flex;align-items:center;justify-content:center}.topbar #refresh:disabled svg{animation:refresh-spin 1s linear infinite}@keyframes refresh-spin{to{transform:rotate(360deg)}}.cards{margin:14px 0;gap:8px}.stat{padding:12px 14px}.stat strong{font-size:25px;margin-top:5px}.toolbar{margin:14px 0 10px}.list-info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}.worker-info h2{font-size:13px;margin:10px 0 5px}@media(max-width:680px){main{padding:12px}.topbar{flex-wrap:wrap}.top-actions{margin-left:auto}.stat{padding:10px}.stat span{font-size:11px}.cards{grid-template-columns:repeat(5,minmax(0,1fr))}.topbar nav button{padding:9px 12px;font-size:13px}}
#production-settings-root input[type=checkbox],#production-settings-root input[type=radio]{width:auto}#production-settings-root details{font-size:inherit;color:inherit}#production-settings-root select,#production-settings-root textarea{font:inherit;color:#e6edf9}#production-settings-root select{max-width:100%}#production-settings-root{overflow-wrap:anywhere}#production-settings-root p{color:inherit}
</style>
<main><div class="topbar"><nav id="tabs" aria-label="작업 종류"><button data-tab="ae" aria-pressed="true" class="selected">AE 후작업</button><button data-tab="render" aria-pressed="false">렌더링</button></nav><div class="top-actions"><span id="connection" class="pill">연결 확인 중</span><button id="refresh" aria-label="새로고침" title="새로고침"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button></div></div>
<details id="local-production-settings" class="banner"><summary style="cursor:pointer;font-size:17px;font-weight:700;color:#85eedb">제작 설정 · 영상 모델/API</summary><p>이 통합워커 안에서 프로젝트의 제작 방식·PSD/AE 연출·타임라인·제작 모드와 영상 생성 모델·API를 설정합니다.</p><div id="production-settings-root"></div></details>
<div id="error" class="error" hidden role="alert"></div>
<div class="toolbar"><div id="filters" class="filters"></div><input id="search" placeholder="프로젝트 이름 검색" aria-label="프로젝트 검색"></div>
<div class="list-info subtle"><span id="scope"></span><span id="queue-status" role="status"></span></div><section id="jobs" aria-label="작업 목록"></section>
<details class="worker-info"><summary>워커 실행 정보</summary><h2 id="manager">워커 상태 확인 중…</h2><div class="subtle" id="activity"></div><pre id="diagnostic"></pre></details></main>
<script>
const labels={all:'전체',waiting:'큐 대기',working:'진행 중',review:'보관',completed:'완료',failed:'실패 / 종료'};
const states={prepared:'준비 자료 · 보관',approved:'레이어 확정',queued:'큐 대기',pending:'큐 대기',processing:'작업 진행 중',rendering:'렌더링 중',direction_approved:'실행 대기',direction_pending:'작성된 지침 · 보관',review_pending:'생성 완료 · 보관',needs_review:'자동 처리 제외',ready:'좌표 준비 완료',reviewed:'AE 검수 완료',completed:'렌더 완료',failed:'작업 실패',obsolete:'이전 버전',cancelled:'취소됨'};
const kinds={region_layer_package:'영역 분리 · 배경 복원',region_motion_plan:'영역 동작 AE 렌더',ae_speaker_coordinates:'얼굴 · 입 좌표 준비',ae_mouth_job:'AE 입모양',render:'최종 렌더'};
let jobs=[],filter='all',running=false,tab='ae',workerStatus=null;
const tabName=()=>tab==='render'?'렌더링':'AE 후작업';
function stateLabel(j){
 if(j.kind==='ae_mouth_job' && j.state==='reviewed' && !j.generated && j.skipped===j.total)return '효과 제외 처리 완료';
 if(j.state==='draft')return '계획 초안 · 보관';
 if(j.group==='waiting')return (j.kind==='render'?'렌더링':'AE 후작업')+' '+(j.state==='direction_approved'?'실행 대기':'큐 대기');
 if(j.state==='processing')return j.kind==='render'?'렌더링 진행 중':'AE 후작업 진행 중';
 if(j.state==='failed')return j.kind==='render'?'렌더링 실패':'AE 후작업 실패';
 return states[j.state]||j.state;
}
const el=id=>document.getElementById(id);
function node(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n}
function stamp(value){return value?new Date(value).toLocaleString('ko-KR'):'—'}
function draw(){
 const scoped=jobs.filter(j=>tab==='render'?j.kind==='render':j.kind!=='render');
 for(const b of el('tabs').querySelectorAll('button')){b.classList.toggle('selected',b.dataset.tab===tab);b.setAttribute('aria-pressed',String(b.dataset.tab===tab))}
 el('filters').replaceChildren(...Object.keys(labels).map(k=>{const count=k==='all'?scoped.length:scoped.filter(j=>j.group===k).length;const b=node('button',`${labels[k]} ${count}`,k===filter?'selected':'');b.setAttribute('aria-pressed',String(k===filter));b.onclick=()=>{filter=k;draw()};return b}));
 const term=el('search').value.toLowerCase(), visible=scoped.filter(j=>(filter==='all'||j.group===filter)&&j.title.toLowerCase().includes(term));
 el('scope').textContent=`${tabName()} · 표시 ${visible.length}건 / 조회 ${scoped.length}건`;el('jobs').replaceChildren();
 drawStatus();
 if(!visible.length){el('jobs').append(node('div',scoped.length?'이 조건에 해당하는 '+tabName()+' 작업이 없습니다.':'등록된 '+tabName()+' 작업이 없습니다.','empty'));return}
 for(const j of visible){const a=node('article'),head=node('div',null,'row');head.append(node('span',kinds[j.kind]||j.kind,'tag'),node('span',stateLabel(j),'badge '+j.group));a.append(head,node('div',j.title,'title'));
 if(j.kind==='render'){const bar=node('div',null,'bar'),fill=node('i');fill.style.width=j.progress+'%';bar.append(fill);a.append(bar,node('div',`실제 렌더 진행률 ${j.progress}%`,'subtle'))}
 else if(j.kind?.startsWith('region_')) a.append(node('div',`씬 ${j.scene_number || '—'} · ${j.state==='ready'?'AE 결과를 확인한 뒤 씬에 적용해 주세요.':states[j.state]||j.state}`,'subtle'));
 else a.append(node('div',j.kind==='ae_speaker_coordinates'?`대상 ${j.total}씬 · 좌표 처리 ${j.done}씬`:`대상 ${j.total}씬 · 실제 생성 ${j.generated||0}씬 · 효과 제외 ${j.skipped||0}씬 · 미처리 ${Math.max(0,j.total-(j.generated||0)-(j.skipped||0))}씬`,'subtle'));
 const meta=node('div',null,'meta');meta.append(node('span','최근 변경 '+stamp(j.updated_at)),node('span',j.phase==='discovery'?'대사·지침 확인 단계':j.phase==='render'?'입모양 생성 단계':''));a.append(meta);
 if(j.scene_numbers?.length)a.append(node('p','자동 판별이 불확실한 씬: '+j.scene_numbers.join(', ')));
 const d=node('details'),s=node('summary','작업 ID 확인');d.append(s,node('pre',`작업 ${j.id}\n프로젝트 ${j.project_id||'—'}`));a.append(d);el('jobs').append(a)}
}
function drawStatus(){
 const s=workerStatus;if(!s)return;
 const current=s.active?(s.active.role==='render'?'render':'ae'):null;
 const name=tabName();
 el('manager').textContent=current===tab?name+' 작업을 처리하고 있습니다':current?name+' 작업이 다른 작업의 종료를 기다립니다':({idle:name+' · 다음 작업을 기다리고 있습니다',starting:'워커를 시작하고 있습니다',resources_busy:name+' · 다른 미디어 작업이 끝나기를 기다립니다',connection_error:'작업 큐 연결을 확인해 주세요',stopped:'워커가 중지되었습니다'})[s.status]||'워커 준비 중';
 el('activity').textContent=(s.active?`현재 실행: ${current==='render'?'최종 렌더링':'AE 후작업'} · 시작 ${stamp(s.active.started_at)}`:name+' 목록과 상태만 표시합니다.')+(s.render_paused?' · 렌더링 실행 일시중지':'');
}
async function refresh(){if(running)return;running=true;el('refresh').disabled=true;
 try{const statusResponse=await fetch('/status');if(!statusResponse.ok)throw Error();const s=await statusResponse.json();const stale=s.updated_at&&Date.now()-Date.parse(s.updated_at)>45000;
 el('connection').textContent=stale?'워커 응답 지연':s.status==='stopped'?'워커 중지':'로컬 연결됨';
 el('manager').textContent=({working:'작업을 처리하고 있습니다',idle:'다음 작업을 기다리고 있습니다',starting:'워커를 시작하고 있습니다',resources_busy:'다른 미디어 작업이 끝나기를 기다립니다',connection_error:'작업 큐 연결을 확인해 주세요',stopped:'워커가 중지되었습니다'})[s.status]||'워커 준비 중';
 el('activity').textContent=(s.active?`${s.active.role==='render'?'최종 렌더':s.active.role==='region'?'영역 분리 · 배경 복원 · AE 동작':'AE 작업'} 실행 · 시작 ${stamp(s.active.started_at)}`:'AE · 렌더를 순서대로 실행합니다.')+(s.render_paused?' · 렌더 실행 일시중지':'');
 el('diagnostic').textContent=`PID: ${s.pid||'—'}\n최근 확인: ${stamp(s.updated_at)}\n`+Object.entries(s.roles||{}).map(([k,v])=>`${k}: ${v.status} / 연속 실패 ${v.failures}`).join('\n')+(s.active?.log?'\n로그: '+s.active.log:'');
 workerStatus=s;drawStatus();
 const response=await fetch('/jobs');if(!response.ok)throw Error();const data=await response.json();jobs=data.jobs||[];draw();
 el('queue-status').textContent=data.error?`목록 자동 재연결 중 · ${data.updated_at?'마지막 갱신 '+stamp(data.updated_at):'첫 목록을 불러오는 중'}`:`목록 갱신 ${stamp(data.updated_at)}`;
 if(data.error)el('diagnostic').textContent+=`\n목록 조회: ${data.error} · 마지막 정상 조회 ${stamp(data.updated_at)}`;
 el('error').hidden=true;
 }catch{el('connection').textContent='재연결 중';el('error').hidden=true;el('queue-status').textContent='자동 재연결 중 · 마지막 목록 유지';}
 finally{running=false;el('refresh').disabled=false}}
 el('tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;filter='all';el('search').value='';draw()};
 el('refresh').onclick=refresh;el('search').oninput=draw;refresh();setInterval(refresh,5000);
</script></html>
