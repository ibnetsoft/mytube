name: Windows Release (AIR-0218)

# Triggers:
#   - Push a version tag: git tag v1.0.0 && git push origin v1.0.0
#   - Manual dispatch from GitHub Actions UI (supply version + channel)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (e.g. 1.0.0)"
        required: true
        default: "0.1.0"
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - dev
      draft:
        description: "Create as draft release"
        required: false
        default: "false"
        type: boolean
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write   # required for gh release create/upload

jobs:
  build-and-release:
    name: Build Windows artifacts and publish GitHub Release
    runs-on: windows-latest

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout full history (needed for tag-based version detection)
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------
      # 2. Resolve version and channel from tag or manual input
      # ----------------------------------------------------------------
      - name: Resolve version and channel
        id: resolve
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver     = "${{ github.event.inputs.version }}"
            $channel = "${{ github.event.inputs.channel }}"
            $draft   = "${{ github.event.inputs.draft }}" -eq "true"
            $pre     = "${{ github.event.inputs.prerelease }}" -eq "true"
          } else {
            $ver     = "${{ github.ref_name }}".TrimStart("v")
            $channel = "stable"
            $draft   = $false
            $pre     = $false
          }
          # Read current build counter; increment is done by build_windows.ps1
          $counterFile = "packaging/windows/build_counter.txt"
          $currentBuild = if (Test-Path $counterFile) {
              [int](Get-Content $counterFile -Raw).Trim()
          } else { 0 }
          $nextBuild = $currentBuild + 1

          Write-Host "VERSION=$ver  BUILD=$nextBuild  CHANNEL=$channel"
          "VERSION=$ver"          >> $env:GITHUB_OUTPUT
          "BUILD=$nextBuild"      >> $env:GITHUB_OUTPUT
          "CHANNEL=$channel"      >> $env:GITHUB_OUTPUT
          "DRAFT=$($draft.ToString().ToLower())"       >> $env:GITHUB_OUTPUT
          "PRERELEASE=$($pre.ToString().ToLower())"    >> $env:GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # 3. Python setup
      # ----------------------------------------------------------------
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ----------------------------------------------------------------
      # 4. Inno Setup (for installer .exe)
      # ----------------------------------------------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      # ----------------------------------------------------------------
      # 5. Build — PyInstaller + packaging + SHA256 sidecars
      # ----------------------------------------------------------------
      - name: Build Windows package
        id: build
        shell: pwsh
        env:
          # [AIR-0225B, incident response] SUPABASE_SERVICE_ROLE_KEY must NEVER
          # be passed to this build again. It was injected here until 2026-07-11,
          # which meant every public GitHub release from v2.0.8 through v2.3.5
          # shipped this RLS-bypassing key in plaintext inside app/.env - a public
          # repo, downloadable by anyone. See
          # worknote/AIR-0225B-stage0-service-role-removal-investigation.md for the
          # full investigation and worknote/AIR-0225B-affected-release-inventory.md
          # for the list of releases whose assets were pulled as a result.
          # Only the public Supabase URL (safe by design - NEXT_PUBLIC_*) is passed
          # to the desktop build now. Features that still need privileged Supabase
          # access must go through an auth-web proxy using the user's own JWT.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # SMTP credentials for signup email verification codes
          # (services/email_service.py). Missing here silently disabled
          # email sending in every build from v2.0.8 through v2.2.1 - no
          # crash, just "이메일 발송에 실패했습니다" on every signup attempt.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          $ver     = "${{ steps.resolve.outputs.VERSION }}"
          $build   = [int]"${{ steps.resolve.outputs.BUILD }}"
          $channel = "${{ steps.resolve.outputs.CHANNEL }}"
          .\tools\build_windows.ps1 `
            -Version $ver `
            -Build   $build `
            -Channel $channel `
            -GitHubRepo "ibnetsoft/AIR-releases"

          # Expose artifact paths for upload step
          $zipName  = "AIRStudio-$ver-win-x64.zip"
          $instName = "AIRStudioSetup-$ver.exe"
          "ZIP_NAME=$zipName"   >> $env:GITHUB_OUTPUT
          "INST_NAME=$instName" >> $env:GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # 5b. [AIR-0225B] Secret scan gate - must pass before anything built in
      #     this run is uploaded anywhere (workflow-run artifact or public
      #     release). See tools/scan_release_secrets.ps1 and
      #     worknote/AIR-0225B-stage0-service-role-removal-investigation.md.
      # ----------------------------------------------------------------
      - name: Scan release artifacts for leaked secrets
        shell: pwsh
        run: |
          .\tools\scan_release_secrets.ps1 -Path release\staging\AIRStudio, dist\AIRStudio, `
            "release\${{ steps.build.outputs.ZIP_NAME }}", `
            "release\${{ steps.build.outputs.INST_NAME }}"

      # ----------------------------------------------------------------
      # 6. Upload build artifacts (for debugging / manual download)
      # ----------------------------------------------------------------
      - name: Upload release artifacts to workflow run
        # Non-essential backup copy inside the Actions run itself; the actual
        # distribution is the "Publish GitHub Release" step below, which
        # uploads to the separate ibnetsoft/AIR-releases repo and has its own
        # storage quota. Don't let this step's quota exhaustion block a release.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.resolve.outputs.VERSION }}-build${{ steps.resolve.outputs.BUILD }}
          path: |
            release/${{ steps.build.outputs.ZIP_NAME }}
            release/${{ steps.build.outputs.ZIP_NAME }}.sha256
            release/${{ steps.build.outputs.INST_NAME }}
            release/${{ steps.build.outputs.INST_NAME }}.sha256
            release/latest.json
            release/latest.json.sha256
          if-no-files-found: warn
          retention-days: 30

      # ----------------------------------------------------------------
      # 7. Publish GitHub Release
      # ----------------------------------------------------------------
      - name: Publish GitHub Release
        shell: pwsh
        env:
          # [FIX] Releases now publish to the separate public ibnetsoft/AIR-releases
          # repo so the source repo (this one) can be private. The default
          # github.token only has write access to the repo the workflow runs in,
          # so a fine-grained PAT with Contents:write on AIR-releases is required
          # (stored as the RELEASES_REPO_TOKEN secret on this repo).
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          $ver     = "${{ steps.resolve.outputs.VERSION }}"
          $build   = "${{ steps.resolve.outputs.BUILD }}"
          $channel = "${{ steps.resolve.outputs.CHANNEL }}"
          $tag     = "v$ver"

          $extraArgs = @()
          if ("${{ steps.resolve.outputs.DRAFT }}"      -eq "true") { $extraArgs += "--draft" }
          if ("${{ steps.resolve.outputs.PRERELEASE }}" -eq "true") { $extraArgs += "--prerelease" }

          .\tools\release_github.ps1 `
            -Version     $ver `
            -Build       ([int]$build) `
            -GitHubRepo  "ibnetsoft/AIR-releases" `
            -Channel     $channel `
            @extraArgs

      # ----------------------------------------------------------------
      # 8. Commit updated build_counter.txt back to the repo
      # ----------------------------------------------------------------
      - name: Commit build counter increment
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/windows/build_counter.txt
          $build = "${{ steps.resolve.outputs.BUILD }}"
          git diff --cached --quiet && echo "No counter change to commit." && exit 0
          git commit -m "chore: increment build counter to $build [skip ci]"
          git push origin HEAD:${{ github.ref_name }} 2>$null || `
          git push origin HEAD:main 2>$null || `
          Write-Warning "Could not push counter update — update manually."
