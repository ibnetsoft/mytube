{% extends "base.html" %}
{% block content %}
<div class="max-w-6xl mx-auto py-8 px-4 sm:px-6 lg:px-8 pb-24">
    
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-black text-white flex items-center gap-3">
            <span class="text-4xl">👥</span> <span data-i18n="title"></span>
        </h1>
        <p class="text-white/60 mt-2 text-lg" data-i18n="subtitle"></p>
    </div>

    <!-- Tabs -->
    <div class="mb-8 border-b border-white/10">
        <nav class="flex space-x-4 overflow-x-auto pb-2" aria-label="Tabs" id="referral-tabs">
            <button class="tab-btn active bg-white/10 text-white px-4 py-2 rounded-lg font-medium whitespace-nowrap transition-colors" data-target="tab-overview" data-i18n="tab_overview"></button>
            <button class="tab-btn hover:bg-white/5 text-white/60 hover:text-white px-4 py-2 rounded-lg font-medium whitespace-nowrap transition-colors" data-target="tab-tree" data-i18n="tab_tree"></button>
            <button class="tab-btn hover:bg-white/5 text-white/60 hover:text-white px-4 py-2 rounded-lg font-medium whitespace-nowrap transition-colors" data-target="tab-history" data-i18n="tab_history"></button>
            <button class="tab-btn hover:bg-white/5 text-white/60 hover:text-white px-4 py-2 rounded-lg font-medium whitespace-nowrap transition-colors" data-target="tab-withdrawal" data-i18n="tab_withdrawal"></button>
        </nav>
    </div>

    <!-- Tab Contents -->
    <div id="tab-overview" class="tab-content block">
        <!-- My Referral Code & Link Section -->
        <div class="bg-gradient-to-r from-indigo-900/40 to-purple-900/40 rounded-2xl p-6 border border-indigo-500/30 mb-8 space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 border-b border-indigo-500/20 pb-3">
                <div>
                    <h3 class="text-lg font-bold text-white" data-i18n="my_code_title"></h3>
                    <p class="text-indigo-200/60 text-xs mt-0.5" data-i18n="my_code_desc"></p>
                </div>
                <span class="text-xs text-purple-300/80 font-medium">SNS 추천 링크 클릭 시 추천 코드가 자동 적용됩니다.</span>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <!-- Referral Code -->
                <div class="space-y-1">
                    <label class="block text-xs font-bold text-indigo-300">추천 코드</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="referral-code-input" readonly 
                               class="w-full bg-black/50 border border-white/20 rounded-xl py-2.5 px-3 text-white font-mono text-center text-base focus:outline-none focus:border-indigo-500 transition-colors"
                               value="">
                        <button id="copy-btn" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition-transform hover:scale-105 flex items-center justify-center gap-1.5 whitespace-nowrap text-xs">
                            <span id="copy-icon">📋</span>
                            <span id="copy-text" data-i18n="copy_btn"></span>
                        </button>
                    </div>
                </div>

                <!-- Referral Link -->
                <div class="lg:col-span-2 space-y-1">
                    <label class="block text-xs font-bold text-indigo-300">추천 가입 링크 (SNS 전달용)</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="referral-link-input" readonly 
                               class="w-full bg-black/50 border border-white/20 rounded-xl py-2.5 px-3 text-purple-200 font-mono text-xs focus:outline-none focus:border-indigo-500 transition-colors truncate"
                               value="">
                        <button id="copy-link-btn" class="px-4 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg transition-transform hover:scale-105 flex items-center justify-center gap-1.5 whitespace-nowrap text-xs">
                            <span id="copy-link-icon">🔗</span>
                            <span id="copy-link-text">링크 복사</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="kpi-container">
            <!-- Skeleton Loaders -->
            <div class="bg-white/5 rounded-2xl p-6 border border-white/10 animate-pulse">
                <div class="h-4 bg-white/10 rounded w-1/2 mb-4"></div>
                <div class="h-8 bg-white/10 rounded w-1/3"></div>
            </div>
            <div class="bg-white/5 rounded-2xl p-6 border border-white/10 animate-pulse">
                <div class="h-4 bg-white/10 rounded w-1/2 mb-4"></div>
                <div class="h-8 bg-white/10 rounded w-1/3"></div>
            </div>
            <div class="bg-indigo-900/50 rounded-2xl p-6 border border-indigo-500/30 animate-pulse">
                <div class="h-4 bg-indigo-500/30 rounded w-1/2 mb-4"></div>
                <div class="h-8 bg-indigo-500/30 rounded w-1/3"></div>
            </div>
            <div class="bg-gradient-to-br from-green-900/50 to-emerald-900/50 rounded-2xl p-6 border border-green-500/30 animate-pulse">
                <div class="h-4 bg-green-500/30 rounded w-1/2 mb-4"></div>
                <div class="h-8 bg-green-500/30 rounded w-1/3"></div>
            </div>
        </div>
    </div>

    <div id="tab-tree" class="tab-content hidden">
        <!-- Referral Tree -->
        <div class="bg-white/5 rounded-2xl border border-white/10 p-6 overflow-hidden">
            <div class="flex justify-end mb-4">
                <div class="flex gap-1 p-1 bg-black/20 rounded-xl border border-white/5">
                    <button id="tree-view-list-btn" onclick="setTreeView('list')"
                        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors bg-indigo-600 text-white">
                        <span data-i18n="view_list"></span>
                    </button>
                    <button id="tree-view-card-btn" onclick="setTreeView('card')"
                        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors text-white/50 hover:text-white">
                        <span data-i18n="view_card"></span>
                    </button>
                </div>
            </div>
            <div id="tree-container" class="space-y-4">
                <!-- Skeleton -->
                <div class="animate-pulse space-y-3">
                    <div class="h-10 bg-white/5 rounded-xl w-full"></div>
                    <div class="h-10 bg-white/5 rounded-xl w-5/6 ml-6"></div>
                    <div class="h-10 bg-white/5 rounded-xl w-4/6 ml-12"></div>
                </div>
            </div>
            
            <!-- Empty State -->
            <div id="tree-empty" class="hidden text-center py-10">
                <div class="text-4xl mb-4 opacity-50">🌱</div>
                <h3 class="text-lg font-bold text-white" data-i18n="tree_empty_title"></h3>
                <p class="text-white/50 mt-1" data-i18n="tree_empty_desc"></p>
            </div>
        </div>
    </div>

    <div id="tab-history" class="tab-content hidden">
        <!-- Commission Timeline -->
        <div class="bg-white/5 rounded-2xl border border-white/10 p-6">
            <div id="timeline-container" class="space-y-3">
                <!-- Dynamic Content -->
                <div class="animate-pulse space-y-3">
                    <div class="h-16 bg-white/5 rounded-xl w-full"></div>
                    <div class="h-16 bg-white/5 rounded-xl w-full"></div>
                </div>
            </div>
            
            <div id="timeline-empty" class="hidden text-center py-10">
                <p class="text-white/50" data-i18n="timeline_empty"></p>
            </div>
            
            <div class="mt-6 text-center">
                <button id="load-more-btn" class="hidden px-6 py-2 bg-white/10 hover:bg-white/20 text-white rounded-full font-medium transition-colors text-sm" data-i18n="load_more">
                </button>
            </div>
        </div>
    </div>

    <div id="tab-withdrawal" class="tab-content hidden">
        <!-- Withdrawal -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-gradient-to-br from-green-900/40 to-emerald-900/40 rounded-2xl p-6 border border-green-500/30">
                    <div class="text-green-300 text-sm font-medium mb-1" data-i18n="withdrawable_balance"></div>
                    <div class="text-3xl font-black text-green-400 flex items-baseline gap-1">
                        <span id="withdrawable-amount">0.000000</span>
                        <span class="text-sm font-bold opacity-70">USDT</span>
                    </div>
                </div>
                <div class="bg-indigo-900/30 rounded-2xl p-6 border border-indigo-500/30">
                    <div class="text-indigo-300 text-sm font-medium mb-1" data-i18n="pending_withdrawal"></div>
                    <div class="text-xl font-bold text-indigo-400 flex items-baseline gap-1">
                        <span id="pending-withdrawal-amount">0.000000</span>
                        <span class="text-xs font-bold opacity-70">USDT</span>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-2">
                <div class="bg-white/5 rounded-2xl border border-white/10 p-6">
                    <h3 class="text-lg font-bold text-white mb-4" data-i18n="req_withdrawal_title"></h3>
                    <form id="withdrawal-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-white/70 mb-1" data-i18n="withdrawal_address"></label>
                            <input type="text" id="withdrawal-address" required
                                   class="w-full bg-black/50 border border-white/20 rounded-xl py-3 px-4 text-white font-mono text-sm focus:outline-none focus:border-green-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-white/70 mb-1" data-i18n="withdrawal_amount"></label>
                            <div class="relative">
                                <input type="number" id="withdrawal-amount-input" required step="0.000001" min="10"
                                       class="w-full bg-black/50 border border-white/20 rounded-xl py-3 px-4 text-white font-mono text-sm focus:outline-none focus:border-green-500 transition-colors">
                                <button type="button" id="btn-max" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold bg-white/10 hover:bg-white/20 text-white px-2 py-1 rounded transition-colors">MAX</button>
                            </div>
                            <p class="text-xs text-white/40 mt-1" data-i18n="min_withdrawal_notice"></p>
                        </div>
                        <button type="submit" id="withdrawal-submit-btn" class="w-full py-3 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white font-bold rounded-xl shadow-lg transition-transform hover:scale-[1.02] flex items-center justify-center gap-2">
                            <span data-i18n="req_withdrawal_btn"></span>
                        </button>
                    </form>
                    <div id="withdrawal-msg" class="mt-4 text-sm font-medium hidden p-3 rounded-lg"></div>
                </div>
            </div>
        </div>
    </div>
</div>

        });

        // Tabs logic
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => {
                    b.classList.remove('active', 'bg-white/10', 'text-white');
                    b.classList.add('text-white/60', 'hover:bg-white/5', 'hover:text-white');
                });
                btn.classList.add('active', 'bg-white/10', 'text-white');
                btn.classList.remove('text-white/60', 'hover:bg-white/5', 'hover:text-white');

                const target = btn.dataset.target;
                tabContents.forEach(content => {
                    if (content.id === target) {
                        content.classList.remove('hidden');
                        content.classList.add('block');
                    } else {
                        content.classList.add('hidden');
                        content.classList.remove('block');
                    }
                });
            });
        });

        // Fetch auth logic
        let token = localStorage.getItem('supabase.auth.token');
        if (token) {
            try {
                const parsed = JSON.parse(token);
                token = parsed.currentSession?.access_token || parsed.access_token || token;
            } catch(e) {}
        }
        const localToken = document.cookie.split('; ').find(row => row.startsWith('auth_token='));
        if (localToken) token = localToken.split('=')[1];

        const headers = {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };

        const fmt = (val) => {
            const n = parseFloat(val) || 0;
            return n % 1 === 0 ? n.toLocaleString() : n.toFixed(6).replace(/\.?0+$/, '');
        };

        let myReferralCode = '';
        let maxWithdrawable = 0;

        async function loadDashboard() {
            try {
                const res = await fetch(`/api/user/referrals/dashboard`, { headers });
                if (!res.ok) throw new Error('Failed to fetch dashboard');
                const resp = await res.json();
                const data = resp.data || resp;

                myReferralCode = data.referralCode || '';
                document.getElementById('referral-code-input').value = myReferralCode;
                const linkInput = document.getElementById('referral-link-input');
                if (linkInput && myReferralCode) {
                    linkInput.value = `${window.location.origin}/?ref=${encodeURIComponent(myReferralCode)}`;
                }

                const personUnit = t.person_unit ? ` ${t.person_unit}` : '';

                const kpiHTML = `
                    <div class="bg-white/5 rounded-2xl p-6 border border-white/10 hover:bg-white/10 transition-colors">
                        <div class="text-white/60 text-sm font-medium mb-1">${t.kpi_total}</div>
                        <div class="text-3xl font-black text-white">${data.totalReferrals || 0}${personUnit}</div>
                    </div>
                    <div class="bg-white/5 rounded-2xl p-6 border border-white/10 hover:bg-white/10 transition-colors">
                        <div class="text-white/60 text-sm font-medium mb-1">${t.kpi_active}</div>
                        <div class="text-3xl font-black text-white">${data.activeReferrals || 0}${personUnit}</div>
                        <div class="text-xs text-green-400 mt-2">${t.kpi_active_sub}</div>
                    </div>
                    <div class="bg-indigo-900/30 rounded-2xl p-6 border border-indigo-500/30">
                        <div class="text-indigo-300 text-sm font-medium mb-1">${t.kpi_pending}</div>
                        <div class="text-3xl font-black text-indigo-400">${fmt(data.pendingCommission)} <span class="text-base font-bold opacity-70">USDT</span></div>
                    </div>
                    <div class="bg-gradient-to-br from-green-900/40 to-emerald-900/40 rounded-2xl p-6 border border-green-500/30">
                        <div class="text-green-300 text-sm font-medium mb-1">${t.kpi_total_earn}</div>
                        <div class="text-3xl font-black text-green-400 flex items-baseline gap-1">
                            <span>${fmt(data.totalCommission)}</span>
                            <span class="text-sm font-bold opacity-70">USDT</span>
                        </div>
                    </div>
                `;
                document.getElementById('kpi-container').innerHTML = kpiHTML;
            } catch (err) {
                console.error('Dashboard error:', err);
                document.getElementById('kpi-container').innerHTML =
                    `<div class="col-span-4 text-center text-red-400">${t.data_err}</div>`;
            }
        }

        let treeView = localStorage.getItem('referral_tree_view') || 'list';
        let treeRoots = null;

        function setTreeView(mode) {
            treeView = mode;
            localStorage.setItem('referral_tree_view', mode);
            document.getElementById('tree-view-list-btn').className =
                'px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ' +
                (mode === 'list' ? 'bg-indigo-600 text-white' : 'text-white/50 hover:text-white');
            document.getElementById('tree-view-card-btn').className =
                'px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ' +
                (mode === 'card' ? 'bg-indigo-600 text-white' : 'text-white/50 hover:text-white');
            renderTree();
        }

        function renderNode(node, level = 0) {
            const ml = level * 1.5;
            const isDirect = (node.level !== undefined ? node.level : level) <= 1;
            const badge = isDirect
                ? `<span class="px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 text-[10px] font-bold border border-blue-500/20">${t.tree_direct}</span>`
                : `<span class="px-2 py-0.5 rounded-full bg-white/10 text-white/50 text-[10px] font-bold">${t.tree_indirect}</span>`;

            let html = `
                <div class="flex items-center gap-3 p-3 rounded-xl transition-colors hover:bg-white/5 border border-white/5 bg-black/20" style="margin-left: ${ml}rem">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-sm shadow-inner">
                        ${(node.display_name || 'U').charAt(0).toUpperCase()}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-white font-medium truncate flex items-center gap-2">
                            ${node.display_name || 'Unknown User'} ${badge}
                        </div>
                        <div class="text-white/40 text-xs">${t.tree_joined}: ${new Date(node.created_at).toLocaleDateString()}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-green-400 font-bold text-sm">${fmt(node.total_commission_generated)} USDT</div>
                        <div class="text-white/30 text-[10px]">${t.tree_contrib}</div>
                    </div>
                </div>
            `;
            if (node.children && node.children.length > 0) {
                html += `<div class="mt-2 space-y-2 relative before:absolute before:left-[1.35rem] before:top-0 before:bottom-6 before:w-px before:bg-white/10">`;
                node.children.forEach(child => { html += renderNode(child, level + 1); });
                html += `</div>`;
            }
            return html;
        }

        function renderCard(node, isRoot = false) {
            const active = !!node.is_active;
            const activityPill = active
                ? `<span class="inline-flex items-center gap-1 rounded-full bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-0.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>${t.tree_active}</span>`
                : `<span class="inline-flex items-center gap-1 rounded-full bg-white/5 text-white/40 text-[10px] font-bold px-2 py-0.5"><span class="w-1.5 h-1.5 rounded-full bg-white/30"></span>${t.tree_idle}</span>`;
            const countryTag = node.country
                ? `<span class="rounded-full border border-white/10 bg-white/5 text-white/50 text-[10px] font-bold px-2 py-0.5">${node.country}</span>`
                : '';

            return `
                <div class="w-[210px] shrink-0 rounded-2xl border p-3.5 bg-black/20 ${isRoot ? 'border-indigo-500/60 ring-1 ring-indigo-500/20' : 'border-white/10'}">
                    <div class="flex items-center gap-2.5 mb-2.5">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-inner">
                            ${(node.display_name || 'U').charAt(0).toUpperCase()}
                        </div>
                        <div class="min-w-0">
                            <div class="text-white text-[13px] font-semibold truncate">${node.display_name || 'Unknown User'}</div>
                            <div class="text-white/40 text-[11px] truncate">${node.email || ''}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 mb-2.5">${countryTag}${activityPill}</div>
                    <div class="flex items-baseline justify-between mb-1">
                        <span class="text-lg font-bold text-green-400">${fmt(node.total_commission_generated)}</span>
                        <span class="text-[10px] uppercase tracking-wide text-white/30">USDT</span>
                    </div>
                    <div class="text-[10.5px] text-white/40">${t.tree_joined}: ${new Date(node.created_at).toLocaleDateString()}</div>
                </div>
            `;
        }

        function renderCardTree(root) {
            let html = `<div class="flex flex-col items-center">${renderCard(root, true)}`;
            if (root.children && root.children.length > 0) {
                html += `
                    <div class="h-5 w-px bg-white/10"></div>
                    <div class="flex flex-wrap justify-center gap-4 border-t border-white/10 pt-5">
                        ${root.children.map(child => `
                            <div class="relative">
                                <div class="absolute -top-5 left-1/2 h-5 w-px -translate-x-1/2 bg-white/10"></div>
                                ${renderCard(child)}
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            html += `</div>`;
            return html;
        }

        function renderTree() {
            const container = document.getElementById('tree-container');
            if (!treeRoots || treeRoots.length === 0) return;
            if (treeView === 'card') {
                container.className = 'overflow-x-auto';
                container.innerHTML = `<div class="flex flex-wrap gap-8 justify-center py-2">${treeRoots.map(root => renderCardTree(root)).join('')}</div>`;
            } else {
                container.className = 'space-y-4';
                container.innerHTML = treeRoots.map(root => renderNode(root)).join('');
            }
        }

        async function loadTree() {
            try {
                const res = await fetch(`/api/user/referrals/tree`, { headers });
                if (!res.ok) throw new Error('Failed to fetch tree');
                const rawData = await res.json();
                const treeData = Array.isArray(rawData) ? rawData : (rawData.data || []);

                const container = document.getElementById('tree-container');
                const empty = document.getElementById('tree-empty');

                if (treeData.length === 0) {
                    container.innerHTML = '';
                    empty.classList.remove('hidden');
                    return;
                }

                const map = {};
                const roots = [];
                treeData.forEach(node => { map[node.id] = { ...node, children: [] }; });
                treeData.forEach(node => {
                    if (node.referrer_id && map[node.referrer_id]) {
                        map[node.referrer_id].children.push(map[node.id]);
                    } else {
                        roots.push(map[node.id]);
                    }
                });

                treeRoots = roots;
                setTreeView(treeView);
            } catch (err) {
                console.error('Tree error:', err);
                document.getElementById('tree-container').innerHTML =
                    `<div class="text-center text-red-400">${t.tree_err}</div>`;
            }
        }

        let timelinePage = 1;
        async function loadTimeline(append = false) {
            try {
                const res = await fetch(`/api/user/commissions/timeline?page=${timelinePage}&limit=10`, { headers });
                if (!res.ok) throw new Error('Failed to fetch timeline');
                const data = await res.json();

                const container = document.getElementById('timeline-container');
                const empty = document.getElementById('timeline-empty');
                const loadMoreBtn = document.getElementById('load-more-btn');

                if (!append) container.innerHTML = '';

                const items = data.items || data.data || [];
                if (items.length === 0 && !append) {
                    empty.classList.remove('hidden');
                    loadMoreBtn.classList.add('hidden');
                    return;
                }

                let html = '';
                items.forEach(item => {
                    const isPending = (item.status || '').toUpperCase() === 'PENDING';
                    const isWithdrawal = (item.description || '').toUpperCase() === 'WITHDRAWAL';
                    const statusLabel = isPending ? t.timeline_pending : t.timeline_paid;
                    const desc = isWithdrawal ? t.tab_withdrawal : (item.description || t.timeline_earned);
                    
                    const amountColor = isWithdrawal ? (isPending ? 'text-indigo-400' : 'text-white') : (isPending ? 'text-indigo-400' : 'text-green-400');
                    const amountPrefix = isWithdrawal ? '-' : '+';
                    const bgIcon = isWithdrawal ? 'bg-orange-500/20 text-orange-400' : (isPending ? 'bg-indigo-500/20 text-indigo-400' : 'bg-green-500/20 text-green-400');
                    const icon = isWithdrawal ? '💸' : (isPending ? '⏳' : '💰');
                    
                    html += `
                        <div class="flex items-center gap-4 p-4 rounded-xl border border-white/5 bg-black/20 hover:bg-white/5 transition-colors">
                            <div class="w-12 h-12 rounded-full ${bgIcon} flex items-center justify-center text-xl shrink-0">
                                ${icon}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-white font-medium text-sm sm:text-base">${desc}</div>
                                <div class="text-white/40 text-xs sm:text-sm mt-0.5">${new Date(item.created_at).toLocaleString()}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-black ${amountColor}">${amountPrefix}${fmt(Math.abs(item.amount))} USDT</div>
                                <div class="text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded inline-block mt-1 ${isPending ? 'bg-indigo-500/10 text-indigo-300' : 'bg-green-500/10 text-green-300'}">
                                    ${statusLabel}
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.insertAdjacentHTML('beforeend', html);
                const hasNext = data.has_next || (data.pagination && data.pagination.has_next);
                if (hasNext) {
                    loadMoreBtn.classList.remove('hidden');
                } else {
                    loadMoreBtn.classList.add('hidden');
                }
            } catch (err) {
                console.error('Timeline error:', err);
                if (!append) document.getElementById('timeline-container').innerHTML =
                    `<div class="text-center text-red-400">${t.timeline_err}</div>`;
            }
        }

        async function loadWithdrawalInfo() {
            try {
                const res = await fetch(`/api/user/referrals/withdrawal-info`, { headers });
                if (!res.ok) throw new Error('Failed to fetch withdrawal info');
                const data = await res.json();
                
                if (data.success && data.data) {
                    const info = data.data;
                    maxWithdrawable = info.availableBalance;
                    document.getElementById('withdrawable-amount').innerText = fmt(info.availableBalance);
                    document.getElementById('pending-withdrawal-amount').innerText = fmt(info.pendingWithdrawal);
                }
            } catch (err) {
                console.error('Withdrawal info error:', err);
            }
        }

        document.getElementById('load-more-btn').addEventListener('click', () => {
            timelinePage++;
            loadTimeline(true);
        });

        const copyBtn  = document.getElementById('copy-btn');
        const copyIcon = document.getElementById('copy-icon');
        const copyText = document.getElementById('copy-text');

        copyBtn.addEventListener('click', () => {
            if (!myReferralCode) return;
            navigator.clipboard.writeText(myReferralCode);

            const toast = document.createElement('div');
            toast.className = 'fixed top-10 left-1/2 -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm z-[100] animate-[slideIn_0.3s_ease-out]';
            toast.innerText = t.toast_copied;
            document.body.appendChild(toast);

            fetch(`/api/user/events`, {
                method: 'POST', headers,
                body: JSON.stringify({ event_type: 'COPY_CODE', metadata: { source: 'fastapi_desktop' } })
            }).catch(e => console.error(e));

            copyIcon.innerText = '✅';
            copyText.innerText = t.copied;
            copyBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
            copyBtn.classList.add('bg-green-600', 'hover:bg-green-500');

            setTimeout(() => {
                copyIcon.innerText = '📋';
                copyText.innerText = t.copy_btn;
                copyBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500');
                copyBtn.classList.remove('bg-green-600', 'hover:bg-green-500');
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        });

        const copyLinkBtn = document.getElementById('copy-link-btn');
        const copyLinkIcon = document.getElementById('copy-link-icon');
        const copyLinkText = document.getElementById('copy-link-text');
        if (copyLinkBtn) {
            copyLinkBtn.addEventListener('click', () => {
                const linkVal = document.getElementById('referral-link-input')?.value;
                if (!linkVal) return;
                navigator.clipboard.writeText(linkVal);

                const toast = document.createElement('div');
                toast.className = 'fixed top-10 left-1/2 -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm z-[100] animate-[slideIn_0.3s_ease-out]';
                toast.innerText = '추천 링크가 복사되었습니다!';
                document.body.appendChild(toast);

                if (copyLinkIcon) copyLinkIcon.innerText = '✅';
                if (copyLinkText) copyLinkText.innerText = '복사됨';

                setTimeout(() => {
                    if (copyLinkIcon) copyLinkIcon.innerText = '🔗';
                    if (copyLinkText) copyLinkText.innerText = '링크 복사';
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            });
        }

        document.getElementById('btn-max').addEventListener('click', () => {
            document.getElementById('withdrawal-amount-input').value = maxWithdrawable;
        });

        document.getElementById('withdrawal-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('withdrawal-submit-btn');
            const msgEl = document.getElementById('withdrawal-msg');
            const amount = document.getElementById('withdrawal-amount-input').value;
            const address = document.getElementById('withdrawal-address').value;

            btn.disabled = true;
            btn.style.opacity = '0.7';
            msgEl.classList.add('hidden');

            try {
                const res = await fetch('/api/user/referrals/withdraw', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ amount: parseFloat(amount), dest_address: address })
                });
                const data = await res.json();
                
                msgEl.classList.remove('hidden', 'bg-red-500/20', 'text-red-400', 'bg-green-500/20', 'text-green-400');
                if (data.success) {
                    msgEl.classList.add('bg-green-500/20', 'text-green-400');
                    msgEl.innerText = data.message || "출금 신청 완료";
                    document.getElementById('withdrawal-amount-input').value = '';
                    document.getElementById('withdrawal-address').value = '';
                    loadWithdrawalInfo(); // Refresh balance
                    timelinePage = 1;
                    loadTimeline(false); // Refresh timeline
                } else {
                    msgEl.classList.add('bg-red-500/20', 'text-red-400');
                    msgEl.innerText = data.error || "오류 발생";
                }
            } catch (err) {
                msgEl.classList.remove('hidden');
                msgEl.classList.add('bg-red-500/20', 'text-red-400');
                msgEl.innerText = "네트워크 오류가 발생했습니다.";
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        });

        // ── Init ──────────────────────────────────────────────────────────────
        loadDashboard();
        loadTree();
        loadTimeline();
        loadWithdrawalInfo();

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes slideIn {
                from { transform: translate(-50%, -100%); opacity: 0; }
                to   { transform: translate(-50%, 0);    opacity: 1; }
            }
        `;
        document.head.appendChild(style);
    });
</script>
{% endblock %}
