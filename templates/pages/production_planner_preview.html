<div class="p-6 text-white h-[calc(100vh-4rem)] flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            <span>🏭</span> Production Planner
        </h1>
    </div>

    <div class="flex-1 min-h-0 flex gap-6">
        <!-- Input Panel -->
        <div class="w-1/3 flex flex-col gap-4">
            <div class="bg-[#1c2027] p-4 rounded-lg border border-white/10 flex-1 flex flex-col">
                <h3 class="text-gray-400 font-bold mb-2">Input (Shot Plan JSON)</h3>
                <textarea id="shotInput" class="w-full flex-1 bg-[#101216] text-white p-3 rounded-lg border border-white/10 focus:border-blue-500 focus:outline-none resize-none font-mono text-xs" placeholder="Paste the JSON output from Director AI here..."></textarea>
                
                <button id="planBtn" onclick="planProduction()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <span id="planBtnText">Plan Production</span>
                    <svg id="planBtnLoading" class="animate-spin h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="w-2/3 flex flex-col h-full bg-[#15191f] rounded-lg border border-white/5 overflow-hidden">
            
            <div id="resultContainer" class="hidden flex-1 flex flex-col gap-4 p-4 overflow-y-auto">
                
                <div class="bg-[#1c2027] p-4 rounded-lg border border-white/10 flex justify-between items-center">
                    <div>
                        <h3 class="text-indigo-400 font-bold mb-1">Production Items</h3>
                        <p id="resItemCount" class="text-3xl font-bold text-white">0</p>
                    </div>
                    <div class="text-right">
                        <h3 class="text-green-400 font-bold mb-1">Total Estimated Duration</h3>
                        <p class="text-3xl font-bold text-white"><span id="resTotalDuration">0</span>s</p>
                    </div>
                </div>

                <div class="bg-[#1c2027] p-4 rounded-lg border border-white/10 flex-1">
                    <h3 class="text-pink-400 font-bold mb-2">Items</h3>
                    <div id="resItems" class="flex flex-col gap-3"></div>
                </div>
                
                <div class="mt-4">
                    <h3 class="text-gray-400 font-bold mb-2 text-xs uppercase tracking-wider">Raw JSON</h3>
                    <pre id="resRaw" class="bg-[#101216] p-4 rounded-lg border border-white/5 text-xs text-gray-400 overflow-x-auto max-h-[200px] overflow-y-auto"></pre>
                </div>

            </div>
            
            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-gray-500 h-full">
                <div class="text-4xl mb-3">🎞️</div>
                <p>Paste shot plan JSON and click Plan Production</p>
            </div>
        </div>
    </div>
</div>

<script>
async function planProduction() {
    const shotInput = document.getElementById('shotInput').value.trim();
    if (!shotInput) {
        alert("Please paste the shot plan JSON.");
        return;
    }

    let parsedInput = {};
    try {
        parsedInput = JSON.parse(shotInput);
    } catch (e) {
        alert("Invalid JSON format in the input.");
        return;
    }

    const btnText = document.getElementById('planBtnText');
    const btnLoading = document.getElementById('planBtnLoading');
    const planBtn = document.getElementById('planBtn');

    btnText.classList.add('hidden');
    btnLoading.classList.remove('hidden');
    planBtn.disabled = true;
    planBtn.classList.add('opacity-70');

    try {
        const response = await fetch('/api/production/plan', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ shot_plan: parsedInput })
        });

        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.detail || "Analysis failed");
        }

        renderResult(data);
    } catch (err) {
        alert("Error: " + err.message);
    } finally {
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
        planBtn.disabled = false;
        planBtn.classList.remove('opacity-70');
    }
}

function renderResult(data) {
    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('resultContainer').classList.remove('hidden');
    
    document.getElementById('resItemCount').textContent = data.item_count || 0;
    document.getElementById('resTotalDuration').textContent = data.total_estimated_duration || 0;

    const itemsDiv = document.getElementById('resItems');
    itemsDiv.innerHTML = '';
    
    if (data.production_items && data.production_items.length > 0) {
        data.production_items.forEach(item => {
            let badgeColor = 'bg-gray-600';
            if (item.asset_type === 'image') badgeColor = 'bg-teal-600';
            else if (item.asset_type === 'video') badgeColor = 'bg-indigo-600';
            else if (item.asset_type === 'reuse') badgeColor = 'bg-amber-600';
            
            itemsDiv.innerHTML += `
                <div class="bg-[#2a303c] p-4 rounded border border-white/5">
                    <div class="flex justify-between items-center border-b border-white/5 pb-2 mb-2">
                        <div class="font-bold text-white flex items-center gap-2">
                            <span>Asset: ${item.id}</span>
                            <span class="text-xs px-2 py-0.5 rounded ${badgeColor} text-white">${item.asset_type.toUpperCase()}</span>
                            <span class="text-xs px-2 py-0.5 rounded bg-purple-600 text-white">${item.generator.toUpperCase()}</span>
                        </div>
                        <div class="text-gray-400 font-mono text-sm">${item.target_duration}s</div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-x-4 gap-y-2 text-xs mb-3">
                        <div><span class="text-gray-500">Shot ID:</span> <span class="text-gray-300">${item.shot_id}</span></div>
                        <div><span class="text-gray-500">Priority:</span> <span class="text-gray-300">${item.priority}</span></div>
                    </div>
                    
                    <div class="bg-black/30 p-2 rounded text-xs">
                        <div class="font-bold text-gray-400 mb-1">Prompt Details</div>
                        <div class="grid grid-cols-1 gap-1">
                            <div><span class="text-gray-500">Positive:</span> <span class="text-gray-300 italic">${item.prompt?.positive || '-'}</span></div>
                            <div><span class="text-gray-500">Negative:</span> <span class="text-gray-300 italic">${item.prompt?.negative || '-'}</span></div>
                            <div><span class="text-gray-500">Camera:</span> <span class="text-gray-300">${item.prompt?.camera || '-'}</span></div>
                            <div><span class="text-gray-500">Lighting:</span> <span class="text-gray-300">${item.prompt?.lighting || '-'}</span></div>
                            <div><span class="text-gray-500">Style:</span> <span class="text-gray-300">${item.prompt?.style || '-'}</span></div>
                        </div>
                    </div>
                </div>
            `;
        });
    } else {
        itemsDiv.innerHTML = `<p class="text-gray-500 italic">No production items generated.</p>`;
    }

    document.getElementById('resRaw').textContent = JSON.stringify(data, null, 2);
}
</script>
