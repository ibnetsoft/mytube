{% extends "base.html" %}
{% block content %}
<div class="max-w-6xl mx-auto mt-4 px-4">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-white flex items-center gap-3">
            <span class="text-blue-500">🎙️</span> Admin: Voice Library
        </h1>
        <button onclick="openVoiceModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold transition-all">
            + 새 음성 등록
        </button>
    </div>

    <!-- 필터 및 검색 -->
    <div class="bg-[#232832] p-4 rounded-xl border border-white/5 mb-6 flex flex-wrap gap-4 items-end">
        <div class="flex-1 min-w-[200px]">
            <label class="block text-xs font-medium text-gray-400 mb-1">Language</label>
            <select id="filterLang" class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white text-sm">
                <option value="">All</option>
                <option value="ko">Korean</option>
                <option value="en">English</option>
                <option value="ja">Japanese</option>
            </select>
        </div>
        <div class="flex-1 min-w-[200px]">
            <label class="block text-xs font-medium text-gray-400 mb-1">Provider</label>
            <select id="filterProvider" class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white text-sm">
                <option value="">All</option>
                <option value="elevenlabs">ElevenLabs</option>
                <option value="google">Google</option>
            </select>
        </div>
        <div class="flex items-center gap-2 mb-2">
            <input type="checkbox" id="filterInactive" class="w-4 h-4 rounded bg-[#1c2027] border-white/10">
            <label for="filterInactive" class="text-sm text-gray-300">비활성화 포함</label>
        </div>
        <button onclick="loadVoices()" class="px-4 py-2 bg-[#1c2027] hover:bg-[#2a303c] border border-white/10 text-white rounded font-medium">검색</button>
    </div>

    <!-- 목록 테이블 -->
    <div class="bg-[#232832] rounded-xl border border-white/5 overflow-hidden">
        <table class="w-full text-left text-sm text-gray-300">
            <thead class="bg-[#1c2027] text-xs uppercase text-gray-500">
                <tr>
                    <th class="px-4 py-3">Name</th>
                    <th class="px-4 py-3">Provider (ID)</th>
                    <th class="px-4 py-3">Language</th>
                    <th class="px-4 py-3">Gender / Age</th>
                    <th class="px-4 py-3">Tone</th>
                    <th class="px-4 py-3">Status</th>
                    <th class="px-4 py-3">Actions</th>
                </tr>
            </thead>
            <tbody id="voicesTbody" class="divide-y divide-white/5">
                <tr><td colspan="7" class="text-center py-8 text-gray-500">로딩 중...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 등록/수정 모달 -->
<div id="voiceModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-[#232832] w-full max-w-2xl rounded-2xl border border-white/10 shadow-2xl flex flex-col max-h-[90vh]">
        <div class="p-5 border-b border-white/10 flex justify-between items-center shrink-0">
            <h2 id="modalTitle" class="text-lg font-bold text-white">Voice 등록</h2>
            <button onclick="closeVoiceModal()" class="text-gray-400 hover:text-white">✕</button>
        </div>
        
        <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
            <form id="voiceForm" class="grid grid-cols-2 gap-4">
                <input type="hidden" id="voiceId">
                
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 mb-1">Provider *</label>
                    <input type="text" id="v_provider" required value="elevenlabs" class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white">
                </div>
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 mb-1">Provider Voice ID *</label>
                    <input type="text" id="v_provider_id" required class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white">
                </div>
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 mb-1">Voice Name *</label>
                    <input type="text" id="v_name" required class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white">
                </div>
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-gray-400 mb-1">Language *</label>
                    <input type="text" id="v_lang" required class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white" placeholder="ex: ko, en">
                </div>
                
                <div class="col-span-1">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Gender</label>
                    <input type="text" id="v_gender" class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white" placeholder="female, male">
                </div>
                <div class="col-span-1">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Age Group</label>
                    <input type="text" id="v_age" class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white" placeholder="young_adult, middle_aged">
                </div>
                
                <div class="col-span-1">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Tone</label>
                    <input type="text" id="v_tone" class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white" placeholder="warm, professional">
                </div>
                
                <div class="col-span-1">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Recommended Genres (쉼표 구분)</label>
                    <input type="text" id="v_genres" class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white" placeholder="story, documentary, education">
                </div>
                
                <div class="col-span-2">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Sample Audio URL</label>
                    <input type="text" id="v_sample" class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white">
                </div>
                
                <div class="col-span-2">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Description</label>
                    <textarea id="v_desc" rows="2" class="w-full bg-[#1c2027] border border-white/10 rounded px-3 py-2 text-white"></textarea>
                </div>
            </form>
        </div>
        
        <div class="p-5 border-t border-white/10 bg-[#1c2027] rounded-b-2xl flex justify-end gap-3 shrink-0">
            <button onclick="closeVoiceModal()" class="px-5 py-2 text-gray-400 hover:text-white font-medium">취소</button>
            <button onclick="saveVoice()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold">저장</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allVoices = [];

async function loadVoices() {
    const tbody = document.getElementById('voicesTbody');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-500">데이터를 불러오는 중...</td></tr>';
    
    try {
        const provider = document.getElementById('filterProvider').value;
        const lang = document.getElementById('filterLang').value;
        const incInactive = document.getElementById('filterInactive').checked;
        
        let url = `/api/admin/voices?include_inactive=${incInactive}`;
        if(provider) url += `&provider=${provider}`;
        if(lang) url += `&language=${lang}`;
        
        const res = await fetch(url);
        const json = await res.json();
        
        if(json.success) {
            allVoices = json.data || [];
            renderTable(allVoices);
        } else {
            Utils.showToast("조회 실패", "error");
        }
    } catch(e) {
        console.error(e);
        Utils.showToast("API 요청 오류", "error");
    }
}

function renderTable(data) {
    const tbody = document.getElementById('voicesTbody');
    if(!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-500">등록된 Voice가 없습니다.</td></tr>';
        return;
    }
    
    let html = '';
    data.forEach(v => {
        const activeHtml = v.is_active 
            ? '<span class="px-2 py-0.5 rounded-full bg-green-500/20 text-green-400 text-[10px]">Active</span>'
            : '<span class="px-2 py-0.5 rounded-full bg-red-500/20 text-red-400 text-[10px]">Inactive</span>';
            
        html += `
            <tr class="hover:bg-white/5 transition-colors">
                <td class="px-4 py-3 font-bold text-white">${v.voice_name}</td>
                <td class="px-4 py-3 text-gray-400">${v.provider}<br><span class="text-[10px]">${v.provider_voice_id}</span></td>
                <td class="px-4 py-3">${v.language || '-'}</td>
                <td class="px-4 py-3 text-gray-400">${v.gender || '-'} / ${v.age_group || '-'}</td>
                <td class="px-4 py-3 text-gray-400">${v.tone || '-'}</td>
                <td class="px-4 py-3">${activeHtml}</td>
                <td class="px-4 py-3">
                    <button onclick="editVoice('${v.id}')" class="text-blue-400 hover:underline text-xs mr-2">수정</button>
                    ${v.is_active ? `<button onclick="deleteVoice('${v.id}')" class="text-red-400 hover:underline text-xs">비활성</button>` : ''}
                </td>
            </tr>
        `;
    });
    tbody.innerHTML = html;
}

function openVoiceModal(voice = null) {
    const modal = document.getElementById('voiceModal');
    const title = document.getElementById('modalTitle');
    
    if(voice) {
        title.textContent = 'Voice 수정';
        document.getElementById('voiceId').value = voice.id;
        document.getElementById('v_provider').value = voice.provider || '';
        document.getElementById('v_provider_id').value = voice.provider_voice_id || '';
        document.getElementById('v_name').value = voice.voice_name || '';
        document.getElementById('v_lang').value = voice.language || '';
        document.getElementById('v_gender').value = voice.gender || '';
        document.getElementById('v_age').value = voice.age_group || '';
        document.getElementById('v_tone').value = voice.tone || '';
        document.getElementById('v_genres').value = (voice.recommended_genres || []).join(', ');
        document.getElementById('v_sample').value = voice.sample_audio_url || '';
        document.getElementById('v_desc').value = voice.description || '';
    } else {
        title.textContent = 'Voice 등록';
        document.getElementById('voiceForm').reset();
        document.getElementById('voiceId').value = '';
    }
    
    modal.classList.remove('hidden');
}

function closeVoiceModal() {
    document.getElementById('voiceModal').classList.add('hidden');
}

function editVoice(id) {
    const voice = allVoices.find(v => v.id === id);
    if(voice) openVoiceModal(voice);
}

async function saveVoice() {
    const id = document.getElementById('voiceId').value;
    const isEdit = !!id;
    
    const genresStr = document.getElementById('v_genres').value;
    const genres = genresStr ? genresStr.split(',').map(s => s.trim()).filter(Boolean) : [];
    
    const payload = {
        provider: document.getElementById('v_provider').value,
        provider_voice_id: document.getElementById('v_provider_id').value,
        voice_name: document.getElementById('v_name').value,
        language: document.getElementById('v_lang').value,
        gender: document.getElementById('v_gender').value || null,
        age_group: document.getElementById('v_age').value || null,
        tone: document.getElementById('v_tone').value || null,
        recommended_genres: genres,
        sample_audio_url: document.getElementById('v_sample').value || null,
        description: document.getElementById('v_desc').value || null
    };
    
    if(!payload.provider || !payload.provider_voice_id || !payload.voice_name || !payload.language) {
        Utils.showToast("필수 값을 입력하세요", "warning");
        return;
    }
    
    try {
        const url = isEdit ? `/api/admin/voices/${id}` : `/api/admin/voices`;
        const method = isEdit ? 'PATCH' : 'POST';
        
        const res = await fetch(url, {
            method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        const json = await res.json();
        if(json.success) {
            Utils.showToast("저장 성공", "success");
            closeVoiceModal();
            loadVoices();
        } else {
            Utils.showToast(json.detail || "저장 실패", "error");
        }
    } catch(e) {
        console.error(e);
        Utils.showToast("API 에러", "error");
    }
}

async function deleteVoice(id) {
    if(!confirm("해당 Voice를 비활성화 하시겠습니까?")) return;
    
    try {
        const res = await fetch(`/api/admin/voices/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if(json.success) {
            Utils.showToast("비활성화 처리되었습니다", "success");
            loadVoices();
        } else {
            Utils.showToast("처리 실패", "error");
        }
    } catch(e) {
        Utils.showToast("API 에러", "error");
    }
}

// 초기 로딩
document.addEventListener('DOMContentLoaded', loadVoices);
</script>
{% endblock %}
