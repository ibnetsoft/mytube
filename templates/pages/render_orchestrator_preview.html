<div class="p-6 text-white h-[calc(100vh-4rem)] flex flex-col">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            <span>🚦</span> Render Orchestrator
        </h1>
        <div class="flex gap-2">
            <select id="filterStatus" class="bg-[#1c2027] border border-white/10 text-white rounded p-2" onchange="loadJobs()">
                <option value="">All Status</option>
                <option value="queued">Queued</option>
                <option value="running">Running</option>
                <option value="completed">Completed</option>
                <option value="failed">Failed</option>
                <option value="retry">Retry</option>
            </select>
            <select id="filterGenerator" class="bg-[#1c2027] border border-white/10 text-white rounded p-2" onchange="loadJobs()">
                <option value="">All Generators</option>
                <option value="flux">Flux</option>
                <option value="kling">Kling</option>
                <option value="none">None</option>
            </select>
            <button onclick="loadJobs()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition-colors">
                Refresh Queue
            </button>
        </div>
    </div>

    <div class="flex-1 min-h-0 flex gap-6">
        <!-- Input Panel -->
        <div class="w-1/3 flex flex-col gap-4">
            <div class="bg-[#1c2027] p-4 rounded-lg border border-white/10 flex-1 flex flex-col">
                <h3 class="text-gray-400 font-bold mb-2">Input (Production Plan JSON)</h3>
                <textarea id="planInput" class="w-full flex-1 bg-[#101216] text-white p-3 rounded-lg border border-white/10 focus:border-blue-500 focus:outline-none resize-none font-mono text-xs" placeholder="Paste the JSON output from Production Planner here..."></textarea>
                
                <button id="createBtn" onclick="createJobs()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <span id="createBtnText">Create Render Jobs</span>
                    <svg id="createBtnLoading" class="animate-spin h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Output Panel (Queue) -->
        <div class="w-2/3 flex flex-col h-full bg-[#15191f] rounded-lg border border-white/5 overflow-hidden">
            
            <div id="jobContainer" class="flex-1 flex flex-col p-4 overflow-y-auto">
                <h3 class="text-indigo-400 font-bold mb-3">Render Queue</h3>
                
                <div id="jobsList" class="flex flex-col gap-3">
                    <p class="text-gray-500 italic text-center py-10">Loading jobs...</p>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
async function loadJobs() {
    const jobsList = document.getElementById('jobsList');
    jobsList.innerHTML = `<p class="text-gray-500 italic text-center py-10">Loading...</p>`;
    
    const status = document.getElementById('filterStatus').value;
    const generator = document.getElementById('filterGenerator').value;
    
    let url = '/api/render/jobs?';
    if (status) url += `status=${status}&`;
    if (generator) url += `generator=${generator}&`;

    try {
        const response = await fetch(url);
        const jobs = await response.json();
        
        if (!response.ok) throw new Error("Failed to load jobs");
        
        renderJobs(jobs);
    } catch (err) {
        jobsList.innerHTML = `<p class="text-red-500 text-center py-10">Error: ${err.message}</p>`;
    }
}

function renderJobs(jobs) {
    const jobsList = document.getElementById('jobsList');
    jobsList.innerHTML = '';
    
    if (!jobs || jobs.length === 0) {
        jobsList.innerHTML = `<p class="text-gray-500 italic text-center py-10">No jobs found.</p>`;
        return;
    }
    
    jobs.forEach(job => {
        let statusColor = 'bg-gray-600';
        if (job.status === 'queued') statusColor = 'bg-yellow-600';
        else if (job.status === 'completed') statusColor = 'bg-green-600';
        else if (job.status === 'failed') statusColor = 'bg-red-600';
        else if (job.status === 'running') statusColor = 'bg-blue-600';
        
        jobsList.innerHTML += `
            <div class="bg-[#2a303c] p-4 rounded border border-white/5">
                <div class="flex justify-between items-center border-b border-white/5 pb-2 mb-2">
                    <div class="font-bold text-white flex items-center gap-2">
                        <span class="text-xs font-mono text-gray-400">${job.id.substring(0,8)}</span>
                        <span class="text-xs px-2 py-0.5 rounded ${statusColor} text-white">${job.status.toUpperCase()}</span>
                        <span class="text-xs px-2 py-0.5 rounded bg-purple-600 text-white">${job.generator.toUpperCase()}</span>
                        <span class="text-xs px-2 py-0.5 rounded bg-gray-700 text-white">${job.asset_type.toUpperCase()}</span>
                    </div>
                    <div class="text-gray-400 text-xs">Retries: ${job.retry_count}/${job.max_retries} | Pri: ${job.priority}</div>
                </div>
                
                <div class="grid grid-cols-2 gap-x-4 gap-y-2 text-xs mb-3">
                    <div><span class="text-gray-500">Shot ID:</span> <span class="text-gray-300">${job.shot_id}</span></div>
                    <div><span class="text-gray-500">Item ID:</span> <span class="text-gray-300">${job.production_item_id}</span></div>
                </div>
                
                <div class="mt-2">
                    <details class="text-xs">
                        <summary class="text-gray-500 cursor-pointer hover:text-white">View Raw JSON</summary>
                        <pre class="bg-black/40 p-2 mt-2 rounded border border-white/5 text-gray-400 overflow-x-auto">${JSON.stringify(job, null, 2)}</pre>
                    </details>
                </div>
            </div>
        `;
    });
}

async function createJobs() {
    const planInput = document.getElementById('planInput').value.trim();
    if (!planInput) {
        alert("Please paste the production plan JSON.");
        return;
    }

    let parsedInput = {};
    try {
        parsedInput = JSON.parse(planInput);
    } catch (e) {
        alert("Invalid JSON format in the input.");
        return;
    }

    const btnText = document.getElementById('createBtnText');
    const btnLoading = document.getElementById('createBtnLoading');
    const createBtn = document.getElementById('createBtn');

    btnText.classList.add('hidden');
    btnLoading.classList.remove('hidden');
    createBtn.disabled = true;
    createBtn.classList.add('opacity-70');

    try {
        const response = await fetch('/api/render/jobs', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ production_plan: parsedInput })
        });

        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.detail || "Failed to create jobs");
        }

        alert(`Successfully created ${data.job_count} jobs!`);
        document.getElementById('planInput').value = '';
        loadJobs();
    } catch (err) {
        alert("Error: " + err.message);
    } finally {
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
        createBtn.disabled = false;
        createBtn.classList.remove('opacity-70');
    }
}

// Initial load
document.addEventListener('DOMContentLoaded', () => {
    loadJobs();
});
</script>
